default_profile = "default"

[profiles.default]
user_id = "@user:matrix.org"
password_file = "/path/to/password"
url = "https://matrix.org"

[settings]
default_room = "#iamb-users:0x.badd.cafe"
external_edit_file_suffix = ".md"
log_level = "warn"
message_shortcode_display = false
open_command = ["my-open", "--file"]
reaction_display = true
reaction_shortcode_display = false
read_receipt_display = true
read_receipt_send = true
request_timeout = 10000
typing_notice_display = true
typing_notice_send = true
user_gutter_width = 30
username_display = "username"

[settings.encryption]
indicator = "only-encrypted"
location = "title|prompt"

# A homeserver cannot search a room it cannot read, so ":search" finds nothing
# in an encrypted room. Turn this on to index the text of encrypted rooms on
# this machine instead. Understand what it writes to disk before you do:
#
#   * The words of every indexed message go into ~/.local/share/iamb/profiles/
#     <profile>/search-index/, and stay there until you delete it.
#   * It also turns on the matrix-sdk event cache, which writes the full
#     decrypted JSON of every event, in every room, to the sqlite store.
#
# The passphrase encrypts the index directory. It protects a copy of the index
# that leaves this machine, such as a backup. It protects nothing against
# anything that can read this file.
#
# The index is disposable. Delete the directory to start again.
[settings.local_index]
enabled = false
passphrase = "change me"

[settings.image_preview]
protocol.type = "sixel"
size = { "width" = 66, "height" = 10 }

[settings.sort]
rooms = ["favorite", "lowpriority", "unread", "name"]
members = ["power", "id"]

[settings.terminal]
cursor_shape = "default"
enable_extended_keys = false
enable_title = true

[settings.users]
"@user:matrix.org" = { "name" = "John Doe", "color" = "magenta" }

[layout]
style = "config"

[[layout.tabs]]
window = "iamb://dms"

[[layout.tabs]]
window = "iamb://rooms"

[[layout.tabs]]
split = [
    { "window" = "#iamb-users:0x.badd.cafe" },
    { "window" = "#iamb-dev:0x.badd.cafe" }
]

[macros.insert]
"jj" = "<Esc>"

[macros."normal|visual"]
"V" = "<C-W>m"

[dirs]
cache = "/home/user/.cache/iamb/"
logs = "/home/user/.local/share/iamb/logs/"
downloads = "/home/user/Downloads/"
